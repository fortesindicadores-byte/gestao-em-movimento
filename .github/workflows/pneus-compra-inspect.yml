name: Pneus Compra Inspect (conferência)

# O que o Prolog entrega para as colunas Estoque e Necessidade da Compra de
# Pneus: status, medidas, vidas, posições e tipos de veículo. Não grava nada.
on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Conferir
        env:
          GEM_SUPABASE_SERVICE_KEY: ${{ secrets.GEM_SUPABASE_SERVICE_KEY }}
        run: node scripts/pneus-compra-inspect.mjs
