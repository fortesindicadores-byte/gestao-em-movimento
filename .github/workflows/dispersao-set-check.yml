name: Dispersao Set Check

# Dispersão de km do mês importado (banco) × mês anterior (aba), unidade a
# unidade, e o km da Km/L que ficou fora da planilha. Não grava nada.
on:
  workflow_dispatch:
    inputs:
      vig:
        description: 'Vigência (AAAA-MM)'
        required: false
        default: '2026-09'

jobs:
  conferir:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Conferir
        env:
          GEM_SUPABASE_SERVICE_KEY: ${{ secrets.GEM_SUPABASE_SERVICE_KEY }}
          VIG: ${{ inputs.vig }}
        run: node scripts/dispersao-set-check.mjs
