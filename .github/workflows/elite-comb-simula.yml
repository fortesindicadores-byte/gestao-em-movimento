name: Elite Comb Simula (auditoria)

on:
  workflow_dispatch:

jobs:
  simula:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Combustível do Frota de Elite pelas três réguas — pontuação e colocação
        env:
          GEM_SUPABASE_SERVICE_KEY: ${{ secrets.GEM_SUPABASE_SERVICE_KEY }}
        run: node scripts/elite-comb-simula.mjs
