name: Carta Faixa Check

# A coluna FAIXA da visão Placas Contrato chegou ao banco?
#
# O scripts/contrato-faixa-coluna.sql tem TRÊS blocos, e rodar só o primeiro
# deixa o rótulo na view por placa/mês sem ele chegar à materializada que o
# painel lê — nesse caso a tela fica EXATAMENTE igual a antes, sem erro nenhum.
# É por isso que "rodei a query" não prova "a coluna apareceu": este check diz
# em qual dos três lugares o rótulo já está.
#
# Roda DEPOIS do SQL. Não escreve nada.
on:
  workflow_dispatch:

jobs:
  conferir:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Conferir
        env:
          GEM_SUPABASE_SERVICE_KEY: ${{ secrets.GEM_SUPABASE_SERVICE_KEY }}
        run: node scripts/carta-faixa-check.mjs
