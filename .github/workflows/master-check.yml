name: Master Check

# O administrador Master chegou ao banco? Quem é Master (pelo e-mail),
# se as funções master_* existem e quantos cadastros travaram fora da
# aprovação. Só leitura, com a service key. Roda depois do portal-master.sql.
on:
  workflow_dispatch:

jobs:
  conferir:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Conferir
        env:
          GEM_SUPABASE_SERVICE_KEY: ${{ secrets.GEM_SUPABASE_SERVICE_KEY }}
        run: node scripts/master-check.mjs
