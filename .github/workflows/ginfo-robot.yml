name: Ginfo Robot (Power BI -> Supabase)

# Exporta os visuais do BI do Ginfo e grava em ginfo_snapshot (Supabase).
# 1ª fase: rodar manualmente no modo "login" p/ validar o acesso (screenshots
# ficam nos artifacts do run). Depois de mapear as abas, ativar o cron.
on:
  workflow_dispatch:
    inputs:
      modo:
        description: "login = testa acesso · mapa = reconhece o portal novo · tabelas = lista as tabelas e filtros de UMA aba · run = exporta e grava"
        required: true
        default: "login"
        type: choice
        options: [login, mapa, tabelas, run]
      aba:
        description: "conferência: rodar só esta chave (ex.: checklist-031120)"
        required: false
        default: ""
      mes:
        description: "conferência: forçar o mês do slicer (ex.: julho)"
        required: false
        default: ""
      dry:
        description: "conferência: não gravar no Supabase, só imprimir o resumo"
        required: false
        default: false
        type: boolean
      publicar:
        description: "conferência: publica os prints CIFRADOS no branch tmp-ginfo-prints (o download do artifact não passa pelo proxy da sessão)"
        required: false
        default: false
        type: boolean
      so_apagar:
        description: "só apaga o branch temporário tmp-ginfo-prints"
        required: false
        default: false
        type: boolean
  # todo dia às 7:00 BRT (10:00 UTC) — baixa as 7 abas e atualiza o Supabase.
  # (só roda a partir da branch main — agendamento do GitHub é sempre na default)
  schedule:
    - cron: '0 10 * * *'

permissions:
  contents: write   # só para o branch temporário dos prints cifrados (publicar / so_apagar)

concurrency:
  # UMA CONTA SÓ NO GINFO: elite-robot, ginfo-robot e conf-detalhe entram no
  # portal com o MESMO usuário, e o portal não aguenta duas sessões — a
  # segunda derruba a primeira, o iframe do Power BI passa a renderizar sem
  # slicer nenhum e a coleta aborta sem gravar. Os crons de 10:00, 10:30 e
  # 11:00 UTC pareciam separados, mas o Elite passa de 45 min e alcançava o
  # conf-detalhe todo dia. Grupo compartilhado: o segundo espera, não briga.
  group: ginfo-conta
  cancel-in-progress: false

jobs:
  robo:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # mais paciência com o portal lento (05/10/2026)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar Playwright + xlsx
        run: |
          npm init -y >/dev/null 2>&1
          npm i --no-audit --no-fund playwright xlsx
          npx playwright install --with-deps chromium
      - name: Apagar o branch temporário dos prints
        if: ${{ github.event.inputs.so_apagar == 'true' }}
        run: git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" --delete tmp-ginfo-prints || echo "branch já não existia"
      - name: Rodar robô
        if: ${{ github.event.inputs.so_apagar != 'true' }}
        run: node scripts/ginfo-robot.mjs
        env:
          # dispatch manual usa o modo escolhido; o cron diário roda em 'run'
          GINFO_MODE:               ${{ github.event.inputs.modo || 'run' }}
          GINFO_USER:               ${{ secrets.GINFO_USER }}
          GINFO_PASS:               ${{ secrets.GINFO_PASS }}
          GINFO_URL:                ${{ secrets.GINFO_URL }}
          GINFO_EMPRESA:            ${{ secrets.GINFO_EMPRESA }}
          GEM_SUPABASE_SERVICE_KEY: ${{ secrets.GEM_SUPABASE_SERVICE_KEY }}
          # conferência (vazios no cron diário — não mudam o run normal)
          GINFO_ABA:                ${{ github.event.inputs.aba }}
          GINFO_MES:                ${{ github.event.inputs.mes }}
          GINFO_DRY:                ${{ github.event.inputs.dry == 'true' && '1' || '' }}
      - name: Avisar por e-mail se falhar
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM:      ${{ vars.MAIL_FROM }}
          MAIL_TO:        ${{ vars.MAIL_TO }}
          WORKFLOW:       ${{ github.workflow }}
          RUN_URL:        ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/avisa-falha.sh
      - name: Publicar screenshots/downloads (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ginfo-artifacts
          path: ginfo-artifacts/
          if-no-files-found: ignore
          retention-days: 7
      # Os prints têm placas e nomes, e o repositório é público: vão CIFRADOS
      # (AES-256 + a chave em RSA-OAEP com scripts/analise-dump.pub.pem, o
      # desenho do Analise Dump e do App Check) num branch órfão temporário.
      # Apagar com so_apagar=true depois de ler.
      - name: Cifrar e publicar os prints no branch temporário
        if: ${{ always() && github.event.inputs.publicar == 'true' && github.event.inputs.so_apagar != 'true' }}
        run: |
          set -e
          rm -rf /tmp/pub && mkdir -p /tmp/pub
          cd "$GITHUB_WORKSPACE/ginfo-artifacts"
          tar -cf /tmp/prints.tar --ignore-failed-read *.png
          openssl rand -out /tmp/k.bin 32
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in /tmp/prints.tar -out /tmp/prints.tar.enc -pass file:/tmp/k.bin
          openssl pkeyutl -encrypt -pubin -inkey "$GITHUB_WORKSPACE/scripts/analise-dump.pub.pem" \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in /tmp/k.bin -out /tmp/pub/chave.enc
          rm -f /tmp/k.bin /tmp/prints.tar
          cd /tmp/pub
          split -b 90m -d -a 2 /tmp/prints.tar.enc prints.enc.
          ls -la
          git init -q -b tmp-ginfo-prints
          git config user.email "actions@github.com" && git config user.name "github-actions"
          git add . && git commit -qm "prints do Ginfo cifrados (temporário, apagar depois de ler)"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" tmp-ginfo-prints
