# Destrava o GitHub Pages quando um deploy anterior fica preso "em andamento"
# e todo deploy novo falha com "due to in progress deployment. Please cancel <sha> first".
# Cancela o deploy preso (pelo SHA) com o token do próprio repositório; o próximo push publica normal.
name: Pages Destrava
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "SHA (completo) do deploy preso"
        required: true
permissions:
  pages: write
  contents: read
jobs:
  cancela:
    runs-on: ubuntu-latest
    steps:
      - name: Estado do deploy preso
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          r=$(gh api "repos/${{ github.repository }}/pages/deployments/${{ inputs.sha }}" 2>&1 || true)
          echo "::notice::antes: $(echo "$r" | tr '\n' ' ' | cut -c1-400)"
      - name: Cancela
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          r=$(gh api -X POST "repos/${{ github.repository }}/pages/deployments/${{ inputs.sha }}/cancel" 2>&1 || true)
          echo "::notice::cancel: $(echo "$r" | tr '\n' ' ' | cut -c1-400)"
          sleep 20
          r=$(gh api "repos/${{ github.repository }}/pages/deployments/${{ inputs.sha }}" 2>&1 || true)
          echo "::notice::depois: $(echo "$r" | tr '\n' ' ' | cut -c1-400)"
