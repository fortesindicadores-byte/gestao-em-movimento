name: Sheets Gviz Check

# O gviz-cache.js responde aos painéis com um payload gviz reconstruído das
# tabelas sh_<slug>. Este check compara, no banco real, a reconstrução com a
# foto crua do Google (gviz_snapshot), célula a célula, e lista as abas que
# ainda não têm tabela (painel que continuaria indo ao Google). Não grava nada.
on:
  workflow_dispatch:

jobs:
  conferir:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Conferir
        env:
          GEM_SUPABASE_SERVICE_KEY: ${{ secrets.GEM_SUPABASE_SERVICE_KEY }}
        run: node scripts/sheets-gviz-check.mjs
