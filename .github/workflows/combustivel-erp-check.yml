name: Combustivel ERP Check

# Dá para montar a Carta de Combustíveis com os abastecimentos do ERP?
# Confere a coluna tipo_combustivel, lista as linhas com R$/L absurdo e
# compara diesel e Arla do ERP com o realizado do DRE, mês a mês.
# Não grava nada.
on:
  workflow_dispatch:
    inputs:
      desde:
        description: 'Desde (AAAA-MM-DD)'
        required: false
        default: '2026-01-01'
      so_encerradas:
        description: 'Só OS encerradas (1 = sim)'
        required: false
        default: ''
      projetos:
        description: 'Listar filial × projeto (1 = sim)'
        required: false
        default: ''
      dump:
        description: 'Imprimir ERP por filial e DRE por unidade (1 = sim)'
        required: false
        default: ''

jobs:
  conferir:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Conferir
        env:
          GEM_SUPABASE_SERVICE_KEY: ${{ secrets.GEM_SUPABASE_SERVICE_KEY }}
          DESDE: ${{ inputs.desde }}
          DUMP: ${{ inputs.dump }}
          PROJETOS: ${{ inputs.projetos }}
          SO_ENCERRADAS: ${{ inputs.so_encerradas }}
        run: node scripts/combustivel-erp-check.mjs
