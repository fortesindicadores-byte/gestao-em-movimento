name: Freightech Robot (Ambev -> Supabase)

# A remuneração da Ambev, do Freightech (freightech.ambev.com.br).
#
#  sonda — alcança o portal? o login passa? como é o menu e que API a
#          página chama? Não coleta nada.
#
#  carga — exporta pela API do FT e grava em ft_linha/ft_layout.
#
# TODO DIA às 05:00 BRT pelo pg_cron do Supabase (scripts/freightech-dispara.sql,
# workflow_dispatch com modo=carga, ultimas=4, refazer=1): carga das 4 últimas
# quinzenas, refazendo o que já está no banco (a quinzena corrente muda até
# fechar, e o FT revisa a anterior). O cron abaixo é só REDE: o agendador do
# GitHub atrasa horas. No `schedule` não existe `inputs`, então os valores dele
# vêm dos `||` abaixo — sem isso o robô rodaria em modo sonda.
#
# Os prints sobem como artefato por 1 dia só: as telas do Freightech têm
# valores de remuneração, e o repositório é público.
on:
  schedule:
    - cron: '20 9 * * *'
  workflow_dispatch:
    inputs:
      modo:
        description: "sonda | mapa | exportar (teste, não grava) | carga (API, grava no banco)"
        required: true
        default: "sonda"
        type: choice
        options: [sonda, mapa, exportar, carga]
      canais:
        description: "exportar: canais separados por vírgula (vazio = ROTA,AS,ARMAZEM,EMPURRADA,INSUMOS)"
        required: false
        default: ""
      tabs:
        description: "exportar: só estas tabelas (vírgula; vazio = a lista da rodada)"
        required: false
        default: ""
      api_tabs:
        description: "exportar (teste): depois do 1º arquivo, pedir estas tabelas direto pela API"
        required: false
        default: ""
      desde:
        description: "carga: desde que ano"
        required: false
        default: "2022"
      ultimas:
        description: "carga: só as N últimas quinzenas (vazio = todas desde o ano)"
        required: false
        default: ""
      refazer:
        description: "carga: 1 = refaz o que já está no banco"
        required: false
        default: ""
      vigs:
        description: "exportar: nº de vigências mais recentes (1 a 8)"
        required: false
        default: "1"

jobs:
  robo:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    concurrency: freightech
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Instalar Playwright
        run: npm i -D playwright@1.47.2 xlsx@0.18.5 && npx playwright install --with-deps chromium
      - name: Rodar
        env:
          FT_MODE: ${{ github.event_name == 'schedule' && 'carga' || github.event.inputs.modo || 'sonda' }}
          FT_CANAIS: ${{ github.event.inputs.canais }}
          FT_TABS: ${{ github.event.inputs.tabs }}
          FT_API_TABS: ${{ github.event.inputs.api_tabs }}
          FT_DESDE: ${{ github.event.inputs.desde || '2022' }}
          FT_ULTIMAS: ${{ github.event_name == 'schedule' && '4' || github.event.inputs.ultimas }}
          FT_REFAZER: ${{ github.event_name == 'schedule' && '1' || github.event.inputs.refazer }}
          GEM_SUPABASE_SERVICE_KEY: ${{ secrets.GEM_SUPABASE_SERVICE_KEY }}
          FT_VIGS: ${{ github.event.inputs.vigs || '1' }}
          FREIGHTECH_USER: ${{ secrets.FREIGHTECH_USER }}
          FREIGHTECH_PASS: ${{ secrets.FREIGHTECH_PASS }}
        run: |
          echo "evento=${{ github.event_name }} · modo=$FT_MODE · desde=$FT_DESDE · ultimas=${FT_ULTIMAS:-todas} · refazer=${FT_REFAZER:-0}"
          node scripts/freightech-robot.mjs
      - name: Avisar por e-mail se falhar
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM:      ${{ vars.MAIL_FROM }}
          MAIL_TO:        ${{ vars.MAIL_TO }}
          WORKFLOW:       ${{ github.workflow }}
          RUN_URL:        ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/avisa-falha.sh
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freightech-shots
          path: freightech-shots/
          if-no-files-found: ignore
          retention-days: 1
