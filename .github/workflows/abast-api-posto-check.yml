name: Abast API Posto Check

# De que sistema e de quais meses vêm os abastecimentos de um posto (abast_api)
# e até onde cada conta do Gasola já foi carregada. Só totais. Não grava nada.
on:
  workflow_dispatch:
    inputs:
      posto:
        description: "parte do nome do posto"
        default: "allers"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Conferir
        env:
          GEM_SUPABASE_SERVICE_KEY: ${{ secrets.GEM_SUPABASE_SERVICE_KEY }}
          POSTO: ${{ github.event.inputs.posto }}
        run: node scripts/abast-api-posto-check.mjs
