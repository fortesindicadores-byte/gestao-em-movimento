name: ERP Abast Cobertura

# Até onde o histórico de abastecimentos alcança no Supabase — período coberto,
# projetos existentes e se 2021 está lá.
#
# As tabelas do ERP (Benner) NÃO existem no portal: o que há é a
# `erp_abastecimentos`, alimentada pela aba "Query Banco" da planilha, com a
# janela que a query da TI traz. Este check mede essa janela em vez de supor.
on:
  workflow_dispatch:

jobs:
  conferir:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Conferir
        env:
          GEM_SUPABASE_SERVICE_KEY: ${{ secrets.GEM_SUPABASE_SERVICE_KEY }}
        run: node scripts/erp-abast-cobertura.mjs
