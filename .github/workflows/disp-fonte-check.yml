name: Disp Fonte Check (auditoria)

# Põe lado a lado a PLANILHA (aba Indisponibilidade do Consolidado Geral, que
# é o que o Gestão à Vista lê hoje) e o BANCO (tabela indisponibilidade, onde
# as unidades lançam pelo app desde 14/08/2026). Por unidade: quantas placas
# cada lado tem, quais batem, quais só a planilha tem e quais só o banco tem.
# Serve para separar "a planilha está velha" de "a placa não foi lançada" —
# na tela os dois parecem a mesma coisa.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Comparar as duas fontes
        env:
          GEM_SUPABASE_SERVICE_KEY: ${{ secrets.GEM_SUPABASE_SERVICE_KEY }}
        run: node scripts/disp-fonte-check.mjs
