name: Dispersao ERP Check

# O km rodado da Dispersão de km sai dos abastecimentos do ERP que já estão no
# banco? Soma o km do ERP por vigência × projeto da OS e lista a aba Dispersão
# de km do banco para comparar com a planilha 01-BD. Não grava nada.
on:
  workflow_dispatch:
    inputs:
      desde:
        description: 'Desde (AAAA-MM-DD)'
        required: false
        default: '2026-01-01'

jobs:
  conferir:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Conferir
        env:
          GEM_SUPABASE_SERVICE_KEY: ${{ secrets.GEM_SUPABASE_SERVICE_KEY }}
          DESDE: ${{ inputs.desde }}
        run: node scripts/dispersao-erp-check.mjs
