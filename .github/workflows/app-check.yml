name: App Check

# Só leitura. Abre o app do celular (/app/) com os painéis REAIS (Supabase só
# leitura com a service key) e imprime o que o app leu de cada painel: hero,
# cards, gráficos e tabelas (contagens e rótulos). Prints como artefato de 1 dia.
# Com publicar=true, os prints e o resumo lido de cada painel (os números reais)
# vão CIFRADOS (chave pública scripts/analise-dump.pub.pem, o mesmo desenho do
# Analise Dump) para o branch temporário tmp-app-prints; so_apagar=true apaga.
on:
  workflow_dispatch:
    inputs:
      paineis:
        description: 'ids do catálogo separados por vírgula (app/catalogo.js)'
        required: false
        default: 'visao-financeira,painel-km,programa-reconhecimento,scorecard,fca-gerencial'
      publicar:
        description: 'true = publica prints e resumos cifrados em tmp-app-prints'
        required: false
        default: 'false'
      so_apagar:
        description: 'true = só apaga o branch temporário tmp-app-prints'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Apagar o branch temporário
        if: ${{ github.event.inputs.so_apagar == 'true' }}
        run: git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" --delete tmp-app-prints || echo "branch já não existia"
      - uses: actions/setup-node@v4
        if: ${{ github.event.inputs.so_apagar != 'true' }}
        with:
          node-version: '20'
      - name: Playwright
        if: ${{ github.event.inputs.so_apagar != 'true' }}
        run: |
          npm init -y >/dev/null 2>&1
          npm i --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Rodar
        if: ${{ github.event.inputs.so_apagar != 'true' }}
        run: node scripts/app-check.mjs
        env:
          GEM_SUPABASE_SERVICE_KEY: ${{ secrets.GEM_SUPABASE_SERVICE_KEY }}
          APP_PAINEIS: ${{ github.event.inputs.paineis }}
          APP_DIR: /tmp/app-check
      - uses: actions/upload-artifact@v4
        if: ${{ always() && github.event.inputs.so_apagar != 'true' }}
        with:
          name: app-prints
          path: /tmp/app-check
          retention-days: 1
      - name: Cifrar e publicar no branch temporário
        if: ${{ github.event.inputs.publicar == 'true' && github.event.inputs.so_apagar != 'true' }}
        run: |
          set -e
          rm -rf /tmp/pub && mkdir -p /tmp/pub
          cd /tmp/app-check
          tar -cf /tmp/prints.tar *.png *.json
          openssl rand -out /tmp/k.bin 32
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in /tmp/prints.tar -out /tmp/prints.tar.enc -pass file:/tmp/k.bin
          openssl pkeyutl -encrypt -pubin -inkey "$GITHUB_WORKSPACE/scripts/analise-dump.pub.pem" \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in /tmp/k.bin -out /tmp/pub/chave.enc
          rm -f /tmp/k.bin /tmp/prints.tar
          cd /tmp/pub
          split -b 90m -d -a 2 /tmp/prints.tar.enc prints.enc.
          ls -la
          git init -q -b tmp-app-prints
          git config user.email "actions@github.com" && git config user.name "github-actions"
          git add . && git commit -qm "prints do app cifrados (temporário, apagar depois de ler)"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" tmp-app-prints
