name: Carta Hodometro Check

# O que a troca de fonte mudou na Carta de Custos (portal da VW na frente da
# planilha, de fevereiro em diante) e de onde vem cada um dos dois hodômetros
# da visão Placas Contrato.
#
# Roda DEPOIS do scripts/contrato-portal.sql. Não escreve nada.
on:
  workflow_dispatch:

jobs:
  conferir:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Conferir
        env:
          GEM_SUPABASE_SERVICE_KEY: ${{ secrets.GEM_SUPABASE_SERVICE_KEY }}
        run: node scripts/carta-hodo-check.mjs
