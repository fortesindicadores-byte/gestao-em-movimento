name: Pneus Filial Check

# Aderência de Pneus mês a mês de uma filial, com a conta do Frota de Elite,
# e se o banco já tem a versão atual da aba Pneus. Não grava nada.
on:
  workflow_dispatch:
    inputs:
      filial:
        description: "Filial como vem do Ginfo"
        default: "CDD GUARULHOS"

jobs:
  conferir:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Conferir
        env:
          GEM_SUPABASE_SERVICE_KEY: ${{ secrets.GEM_SUPABASE_SERVICE_KEY }}
          PN_FILIAL: ${{ github.event.inputs.filial }}
        run: node scripts/pneus-filial-check.mjs
