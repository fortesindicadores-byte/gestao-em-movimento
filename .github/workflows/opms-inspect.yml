name: OPMS Inspect (API do Portal Operacional)
on:
  workflow_dispatch:
    inputs:
      ano:
        description: "Ano (vazio = do mês fechado)"
        default: ""
      mes:
        description: "Mês 1-12 (vazio = mês fechado)"
        default: ""
      spec:
        description: "1 = imprime também a lista de rotas"
        default: "0"
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/opms-inspect.mjs
        env:
          OPMS_USER: ${{ secrets.OPMS_USER }}
          OPMS_PASS: ${{ secrets.OPMS_PASS }}
          OPMS_ANO: ${{ github.event.inputs.ano }}
          OPMS_MES: ${{ github.event.inputs.mes }}
          OPMS_SPEC: ${{ github.event.inputs.spec }}
