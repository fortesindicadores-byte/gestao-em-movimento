name: Km Projeto Placa Check

# Só leitura. Para uma unidade e um mês, cruza os mapas do 2art (remun_mapa) pelo
# projeto do MAPA × o projeto da PLACA no Freightech, e mostra o km remunerado e o
# rodado por projeto nas duas leituras. Ver scripts/km-projeto-placa-check.mjs.
on:
  workflow_dispatch:
    inputs:
      uni:
        description: "Unidade (sigla)"
        required: false
        default: "CGR"
      mes:
        description: "Mês (AAAA-MM)"
        required: false
        default: "2026-10"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Rodar
        env:
          UNI: ${{ github.event.inputs.uni || 'CGR' }}
          MES: ${{ github.event.inputs.mes || '2026-10' }}
          GEM_SUPABASE_SERVICE_KEY: ${{ secrets.GEM_SUPABASE_SERVICE_KEY }}
        run: node scripts/km-projeto-placa-check.mjs
