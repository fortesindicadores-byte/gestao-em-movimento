      }
      R.push({t:'p',tit:g.pac,sub:'FCA · '+vX,url:'../fca-consolidado/',
        caps:gr.map(d=>({prep:fcaDe(d),juntar:true,agrupa:['FATO'],
          rot:nomeDe(d)+' — desvio de R$ '+d.brl.toLocaleString('pt-BR')}))});
    });
  });

  R.push({t:'sec',txt:'Resultados'});
  /* AUDITORIAS SÃO DUAS TABELAS (Demarco e DPO/VPO), lado a lado no painel, e
     o extrai lê só a PRIMEIRA — a outra sumia sem aviso. Aqui cada uma é um
     slide, porque são ~13 unidades cada e empilhá-las numa página só obrigaria
     a fonte a descer abaixo do legível. Apontando a tabela (e não o .main) o
     slide vai pelo paginador e a cor do nível vem do chip de cada célula. */
  R.push(P('Auditorias','Demarco · '+ano,'../auditorias/',``,
    {alvo:"document.querySelector('#tbl-demarco table')"}));
  R.push(P('Auditorias','DPO/VPO · '+ano,'../auditorias/',``,
    {alvo:"document.querySelector('#tbl-dpo table')"}));
  R.push(P('Ranking Unidades','Frota de Elite · '+vX,'../programa-reconhecimento/',
    `__cm.elite(${JSON.stringify([V])}); var _c=document.querySelector('.ind-col'); if(_c&&getComputedStyle(_c).display==='none') toggleIndCols();`,
    {alvo:"document.querySelector('#ranking-table').closest('.tbl-section')"}));
  /* O PÓDIO É MONTADO NO SLIDE, a partir do RANKING (Renan, 19/09/2026: ele
     saía como tarja escura estreita boiando no branco, com os degraus
     cortados na base). O ranking é o mesmo dado do pódio do painel — os três
     primeiros —, e desenhá-lo aqui deixa o slide inteiro escuro e inteiro
     usado, em vez de uma ilha preta no meio da página. */
  R.push(P('Pódio',vX,'../programa-reconhecimento/',`__cm.elite(${JSON.stringify([V])});`,
    {alvo:"document.querySelector('#ranking-table')",podio:true}));
  R.push(P('Pódio','Acum '+ano,'../programa-reconhecimento/',
    `__cm.elite(${JSON.stringify(ACUM)});`,{alvo:"document.querySelector('#ranking-table')",podio:true}));
  R.push(P('Evolução','Frota de Elite · '+ano,'../programa-reconhecimento/',
    `__cm.elite([]);`,{alvo:"document.querySelector('#chartTemporal').closest('.chart-card')"}));
  /* PAINEL DE METAS: aponta a TABELA, não o .main (Renan, 19/09/2026: "painel
     de metas não aparece"). O painel tem dois gráficos, então o alvo cheio
     fazia o slide virar "gráfico + tabela": o gráfico levava flex:1 e a tabela
     de 11 indicadores com Descrição e Regra em prosa ficava espremida no que
     sobrava — que é praticamente nada. Pela tabela o slide vai pelo paginador
     e o que não cabe vira o slide seguinte, inteiro. */
  /* PAINEL DE METAS EM DOIS SLIDES (Renan, 19/09/2026: "se coubesse tudo até
     mais legal"). Tudo numa página só obrigaria a tabela de 5 indicadores com
     Descrição e Regra em prosa a dividir espaço com o hero e dois gráficos —
     que foi como ela sumiu na 1ª geração. Assim nada é espremido e nada falta,
     e o total continua sendo o do hero do painel, não uma soma minha. */
  const pmPrep=`__cm.sel('ms-vig',${JSON.stringify([V])}); atualizar();`;
  R.push(P('Painel de Metas','Gerente de Frota · '+vX,'../painel-metas/',pmPrep,
    {semTab:true, nGraf:1, alvo:"document.querySelector('.main')||document.body"}));
  R.push(P('Painel de Metas','Indicadores · '+vX,'../painel-metas/',pmPrep,
    {alvo:"document.querySelector('#tbl table')"}));

  ROTEIRO=R; ESTADO={};
  pintaRoteiro();
  if(avisa) set('titSub','Roteiro refeito para '+vX+' — '+R.length+' slides.');
}

/* ── a tabela do roteiro ── */
function pintaRoteiro(){
  const tb=$('body-rot'); if(!tb) return;
  const nome=u=>String(u||'').replace(/^\.\.\//,'').replace(/\/$/,'')||'—';
  let n=0;
  tb.innerHTML=ROTEIRO.map((s,i)=>{
    n++;
    if(s.t==='capa') return `<tr><td class="n">${n}</td><td class="tit">${esc(s.tit)}</td>
      <td colspan="3"><span class="pill cap">capa</span> <span class="mut">${esc(s.sub)} · ${esc(s.rod)}</span></td><td>${selo(i)}</td></tr>`;
    if(s.t==='sec') return `<tr class="sep"><td class="n">${n}</td><td colspan="4">${esc(s.txt)}</td><td>${selo(i)}</td></tr>`;
    const caps=s.caps.map(c=>chips(c.prep)).join('');
    const vw=(s.caps[0].prep.match(/__cm\.vw\('([^']+)'\)/)||[])[1]||'—';
    return `<tr><td class="n">${n}</td><td class="tit">${esc(s.tit)}<span class="lin2">${esc(s.sub||'')}</span></td>
      <td><span class="pill">${esc(nome(s.url))}</span>${s.caps.length>1?' <span class="mut">×'+s.caps.length+'</span>':''}</td>
      <td class="mut">${esc(vw)}</td><td>${caps}</td><td>${selo(i)}</td></tr>`;
  }).join('');
  set('n-roteiro',ROTEIRO.length);
  set('sub-rot',VIG?('Fechamento '+vigExt(VIG)+' · '+ROTEIRO.length+' slides · cada um é um print de um painel do portal'):'—');
}
function chips(prep){
  const out=[]; const re=/__cm\.sel\('([^']+)',(\[[^\]]*\])\)/g; let m;
  while((m=re.exec(prep))){
    let vs=[]; try{ vs=JSON.parse(m[2]); }catch(e){}
    const txt=vs.map(v=>String(v).split('|')[0]).join(', ');
    out.push(`<span class="filtro-chip"><b>${esc(m[1].replace('ms-',''))}</b> ${esc(txt.length>34?txt.slice(0,32)+'…':txt)}</span>`);
  }
  return out.join('')||'<span class="mut">—</span>';
}
function selo(i){
  const e=ESTADO[i]; if(!e) return '<span class="mut">—</span>';
  if(e.err) return `<span class="pill err" title="${esc(e.msgs.join(' · '))}">falhou</span>`;
  if(e.msgs&&e.msgs.length) return `<span class="pill esp" title="${esc(e.msgs.join(' · '))}">atenção</span>`;
  return '<span class="pill ok">ok</span>';
}

/* ══════════════════════════════════════════════════════════════
   2 · AS CAPAS — tema Conlog, desenhadas no canvas
   Canvas em vez de html2canvas: é mais nítido, não depende de CDN
   e dá para conferir pixel a pixel no teste.
   ══════════════════════════════════════════════════════════════ */
let _foto=null;
function carregaFoto(){
  if(_foto) return Promise.resolve(_foto);
  return new Promise(res=>{
    const im=new Image();
    im.onload=()=>{ _foto=im; res(im); };
    im.onerror=()=>res(null);          // sem a foto, a capa cai no fundo sólido
    im.src=FOTO;
  });
}
function txtEsp(ctx,txt,x,y,esp){
  let cx=x;
  for(const ch of String(txt)){ ctx.fillText(ch,cx,y); cx+=ctx.measureText(ch).width+esp; }
  return cx-x-esp;
}
function fundoFoto(ctx,W,H,escuro){
  const im=_foto;
  ctx.fillStyle='#0B0D11'; ctx.fillRect(0,0,W,H);
  if(im){
    /* a foto é uma estrada à noite — sem levantar o brilho, o caminhão de
       neon some atrás do escurecedor e a capa vira um retângulo preto */
    const e=Math.max(W/im.width,H/im.height), w=im.width*e, h=im.height*e;
    ctx.save();
    try{ ctx.filter='brightness(1.55) contrast(1.06) saturate(1.18)'; }catch(err){}
    ctx.drawImage(im,(W-w)/2,(H-h)/2,w,h);
    ctx.restore();
  }
  let g=ctx.createLinearGradient(0,0,W,0);
  /* PLATÔ escuro à esquerda, não um degradê reto: o título fica sobre o
     baú do caminhão, que tem o neon da CONLOG aceso — sem o platô o texto
     briga com o logo. À direita o escurecedor abre e a cabine aparece. */
  g.addColorStop(0,   `rgba(9,10,13,${escuro?.95:.95})`);
  g.addColorStop(.38, `rgba(9,10,13,${escuro?.93:.90})`);
  g.addColorStop(.60, `rgba(9,10,13,${escuro?.88:.52})`);
  g.addColorStop(.82, `rgba(9,10,13,${escuro?.82:.22})`);
  g.addColorStop(1,   `rgba(9,10,13,${escuro?.78:.12})`);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  g=ctx.createLinearGradient(0,H*.55,0,H);
  g.addColorStop(0,'rgba(9,10,13,0)'); g.addColorStop(1,'rgba(9,10,13,.75)');
  ctx.fillStyle=g; ctx.fillRect(0,H*.55,W,H*.45);
  const r=ctx.createRadialGradient(W*.08,0,0,W*.08,0,W*.55);
  r.addColorStop(0,'rgba(249,115,22,.20)'); r.addColorStop(1,'rgba(249,115,22,0)');
  ctx.fillStyle=r; ctx.fillRect(0,0,W,H);
}
function desenhaCapa(s,W,H){
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const ctx=cv.getContext('2d'); const k=W/1600;
  fundoFoto(ctx,W,H,false);
  const x=110*k;
  ctx.textBaseline='alphabetic';
  ctx.fillStyle=LARANJA; ctx.font=`800 ${Math.round(17*k)}px Montserrat, sans-serif`;
  txtEsp(ctx,'GESTÃO EM MOVIMENTO · FORTES INDICADORES',x,H*.40,4.5*k);
  ctx.fillStyle='#FFFFFF'; ctx.font=`800 ${Math.round(104*k)}px Montserrat, sans-serif`;
  ctx.fillText(s.tit,x,H*.40+118*k);
  ctx.fillStyle=LARANJA; ctx.fillRect(x,H*.40+160*k,150*k,7*k);
  ctx.fillStyle='#D7DEEA'; ctx.font=`600 ${Math.round(33*k)}px Montserrat, sans-serif`;
  ctx.fillText(s.sub,x,H*.40+228*k);
  ctx.fillStyle='#8B94A6'; ctx.font=`600 ${Math.round(21*k)}px Montserrat, sans-serif`;
  ctx.fillText(s.rod,x,H*.40+272*k);
  ctx.fillStyle=LARANJA; ctx.fillRect(0,H-9*k,W,9*k);
  return cv.toDataURL('image/jpeg',0.93);
}
function desenhaSecao(s,W,H){
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const ctx=cv.getContext('2d'); const k=W/1600;
  fundoFoto(ctx,W,H,true);
  const x=110*k;
  ctx.textBaseline='alphabetic';
  ctx.fillStyle='rgba(255,255,255,.22)'; ctx.fillRect(x,H*.5-92*k,420*k,2*k);
  ctx.fillStyle=AMBAR; ctx.font=`800 ${Math.round(88*k)}px Montserrat, sans-serif`;
  ctx.fillText(String(s.txt).toUpperCase(),x,H*.5+28*k);
  ctx.fillStyle='#8B94A6'; ctx.font=`600 ${Math.round(18*k)}px Montserrat, sans-serif`;
  txtEsp(ctx,'CHECK DE METAS · '+vigExt(VIG).toUpperCase(),x,H*.5+82*k,3*k);
  ctx.fillStyle=LARANJA; ctx.fillRect(0,H-9*k,W,9*k);
  return cv.toDataURL('image/jpeg',0.93);
}
async function pintaCapas(){
  await carregaFoto();
  try{ await document.fonts.load('800 104px Montserrat'); await document.fonts.load('600 33px Montserrat'); }catch(e){}
  const alvo=$('prev-capas'); if(!alvo) return;
  const itens=[{t:'capa',tit:'CHECK DE METAS',sub:'ATIVOS / FROTA / TI',rod:'Fechamento '+vigExt(VIG)}]
    .concat(['Frota','Pneus','Manutenção','Combustíveis','Resultados'].map(t=>({t:'sec',txt:t})));
  alvo.innerHTML=itens.map(s=>{
    const png=s.t==='capa'?desenhaCapa(s,1600,900):desenhaSecao(s,1600,900);
    return `<figure><img src="${png}"><figcaption>${esc(s.t==='capa'?'Capa':'Divisória · '+s.txt)}</figcaption></figure>`;
  }).join('');
  set('n-capas',itens.length);
}

/* ══════════════════════════════════════════════════════════════
   3 · O MOTOR — abre o painel num iframe e fotografa
   ══════════════════════════════════════════════════════════════ */
const CM_HELPER=`window.__cm={
  faltou:[],
  norm:function(s){return String(s==null?'':s).normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').toUpperCase().replace(/\\s+/g,' ').trim();},
  opts:function(w){
    return [].slice.call(w.querySelectorAll('.ms-list input[data-v]')).map(function(i){
      var lb=i.closest('label')||i.parentNode, c=lb.cloneNode(true), o=c.querySelector('.ms-only');
      if(o) o.parentNode.removeChild(o);
      return {v:i.dataset.v,t:(c.textContent||'').replace(/\\s+/g,' ').trim(),el:i};
    });
  },
  sel:function(id,alvos){
    var w=document.getElementById(id), self=this;
    if(!w){ this.faltou.push('não existe o filtro '+id); return; }
    var os=this.opts(w), achou=[];
    (alvos||[]).forEach(function(a){
      var cs=String(a).split('|').map(function(x){return self.norm(x);}), o=null;
      for(var i=0;i<cs.length&&!o;i++){ var c=cs[i];
        o = os.filter(function(x){return self.norm(x.t)===c;})[0]
         || os.filter(function(x){return self.norm(x.v)===c;})[0]
         || os.filter(function(x){return self.norm(x.t).indexOf(c)===0;})[0]
         || os.filter(function(x){return self.norm(x.t).indexOf(c)>=0;})[0];
      }
      if(o) achou.push(o); else self.faltou.push(id+': não achei "'+String(a).split('|')[0]+'"');
    });
    if(!achou.length) return;
    if(!(w._sel instanceof Set)) w._sel=new Set();
    w._sel.clear(); achou.forEach(function(o){ w._sel.add(o.v); });
    os.forEach(function(o){ o.el.checked=w._sel.has(o.v); });
    var all=w.querySelector('.ms-all'); if(all) all.checked=false;
    var cnt=w.querySelector('.ms-cnt'); if(cnt){ cnt.textContent=w._sel.size; cnt.style.display=''; }
    w.classList.add('ativo');
    if(typeof w._render==='function'){ try{ w._render(''); }catch(e){} }
  },
  vw:function(v){
    /* NEM TODO PAINEL TROCA DE VISÃO PELO setVw: o fca-consolidado usa
       vaiPara() e abre no KANBAN. Sem isto o FCA saía em cartões. */
    var f=['setVw','vaiPara','setView','irPara'];
    for(var i=0;i<f.length;i++) if(typeof window[f[i]]==='function'){ window[f[i]](v); return; }
    this.faltou.push('o painel não tem como trocar de visão');
  },
  ate:function(id,texto,acao){
    var f=window[acao]; if(typeof f!=='function'){ this.faltou.push('sem '+acao); return; }
    for(var i=0;i<4;i++){
      var e=document.getElementById(id);
      if(e && this.norm(e.textContent)===this.norm(texto)) return;
      f();
    }
    this.faltou.push(acao+' não chegou em '+texto);
  },
  gate:function(){ return !!document.querySelector('.gate'); },
  /* REDESENHAR NÃO PODE DEPENDER DO NOME (bug real, 19/09/2026): o roteiro
     chamava run() no fca-consolidado, que redesenha com render() — o prep
     morria com "run is not defined" e o slide vinha com o recorte errado,
     sem nada na tela dizendo isso. Aqui tenta os nomes conhecidos, na ordem,
     e só reclama se NENHUM existir. */
  redesenha:function(pref){
    /* A PREFERIDA VEM DO ROTEIRO: painel que tem duas (a Árvore tem
       onFilterChange E atualizar) precisa da certa, senão o slide sai com o
       recorte antigo. A lista é só a rede para quando ela não existir. */
    var f=['run','render','atualizar','onFilterChange','aplica','desenha','renderAll','pinta'];
    if(pref) f=[pref].concat(f.filter(function(x){return x!==pref;}));
    for(var i=0;i<f.length;i++){
      if(typeof window[f[i]]==='function'){ try{ window[f[i]](); return f[i]; }catch(e){
        this.faltou.push('o redesenho ('+f[i]+') deu erro: '+e.message); return f[i]; } }
    }
    this.faltou.push('o painel não tem função de redesenho conhecida');
    return null;
  },
  /* "Traga apenas as tabelas distribuídas" (Renan, 18/09/2026): quando o
     alvo é um card de tabela, o que vai para o slide é a TABELA, não o
     card — que tem a altura da tela inteira e deixava a tabela de sete
     linhas minúscula num mar de branco, com a moldura do card em volta.
     O título do card não faz falta: ele já é o título do slide. */
  tabela:function(el){
    if(!el) return el;
    var t=el.tagName==='TABLE'?el:el.querySelector('table');
    if(!t) return el;
    var alt=el.getBoundingClientRect().height, ta=t.getBoundingClientRect().height;
    /* só troca quando o card é bem maior que a tabela (o resto é vazio) */
    return (alt>ta*1.25 || el.querySelector('.twrap,.tab-wrap,.rot-wrap')) ? t : el;
  },
  /* O FROTA DE ELITE NÃO USA OS FILTROS ms-*: a vigência dele é a variável
     selVig e a lista mora em #ms-vig-list. E o formato NAO e 2026-08 —
     chuta-lo deixou o podio com "2026-08/undefined · Sem dados para o
     periodo" e o ranking vazio. Aqui o valor sai da propria lista. */
  elite:function(alvos){
    var l=document.getElementById('ms-vig-list');
    if(!l){ this.faltou.push('não achei a lista de vigências do Frota de Elite'); return; }
    var self=this;
    var os=[].slice.call(l.querySelectorAll('.ms-opt input')).map(function(i){
      var lb=i.parentNode.querySelector('label');
      return {v:i.value, t:(lb?lb.textContent:'').replace(/\\s+/g,' ').trim()};
    }).filter(function(o){ return o.v; });
    var achou=[];
    (alvos||[]).forEach(function(a){
      var cs=String(a).split('|').map(function(x){return self.norm(x);}), o=null;
      for(var i=0;i<cs.length&&!o;i++){ var c=cs[i];
        o=os.filter(function(x){return self.norm(x.v)===c;})[0]
        ||os.filter(function(x){return self.norm(x.t)===c;})[0]
        ||os.filter(function(x){return self.norm(x.t).indexOf(c)===0;})[0];
      }
      if(o) achou.push(o.v); else self.faltou.push('Frota de Elite: não achei "'+String(a).split('|')[0]+'"');
    });
    if(alvos&&alvos.length&&!achou.length) return;
    if(typeof setSelArr==='function') setSelArr('vig',achou);
    if(typeof updateMsBtn==='function') try{ updateMsBtn('vig'); }catch(e){}
    if(typeof renderAll==='function') renderAll();
  },
  /* NÃO É PRINT: a tabela sai do painel como DADOS e é redesenhada no
     slide (Renan, 18/09/2026: "crie do zero para encaixar em um pdf e
     ppt, não use prints"). Os NÚMEROS continuam sendo os do painel —
     nada é recalculado aqui —, só a apresentação é feita para a página.
     A cor vem computada de cada célula, então verde/vermelho seguem a
     regra do painel sem eu repetir regra nenhuma. */
  /* A BARRA DUPLA AQUI É OBRIGATORIA: o helper é uma template literal, e
     uma barra sozinha antes do s não é escape válido — o parser devolve um
     "s" cru, então a regex
     vira /s+/g e APAGA TODAS AS LETRAS "S" do texto. Foi isto que produziu
     "Combu tívei", "Manutençõe" e "Pneu  Novo" no deck (19/09/2026), e eu
     cheguei a atribuir à fonte do PDF, que não tinha nada a ver. */
  extrai:function(el){
    var t=(el&&el.tagName==='TABLE')?el:(el&&el.querySelector?el.querySelector('table'):null);
    if(!t) return null;
    var cs=function(n){ return window.getComputedStyle(n); };
    /* QUEM PINTA A CÉLULA NÃO É O <td> (bug real, 19/09/2026: "auditorias sem
       as cores dos níveis, ranking do Frota de Elite totalmente sem cor").
       A Auditoria põe <span class="niv" style="background:…;color:…"> dentro
       do td e o ranking põe <span class="score-pill"> / <span class="ind-green">.
       Lendo o estilo do td vinha a cor HERDADA — cinza —, e TODA a cor dos dois
       painéis se perdia no deck. Aqui desço enquanto houver um único filho que
       carregue o texto inteiro: é ele que tem a cor e o fundo. */
    function pintor(n){
      var txt=(n.innerText||'').trim();
      var fs=[].slice.call(n.children).filter(function(k){ return cs(k).display!=='none'; });
      if(fs.length===1 && (fs[0].innerText||'').trim()===txt) return pintor(fs[0]);
      return n;
    }
    var alfa=function(c){
      var m=String(c||'').match(/rgba?\\(([^)]+)\\)/);
      if(!m) return /^#|^[a-z]{3,}$/i.test(String(c||''))&&c!=='transparent'?1:0;
      var p=m[1].split(',');
      return p.length>3?parseFloat(p[3]):1;
    };
    function cel(c){
      var p=pintor(c), st=cs(p);
      /* o FUNDO só conta quando existe um elemento pintando DENTRO do td: o
         fundo do próprio td é o do card/tabela, e carregá-lo faria toda célula
         virar um retângulo cinza no slide. Alpha baixo é textura (o .uni-card
         da Auditoria é 5%), não cor de dado. */
      var bg=null, bloco=false;
      if(p!==c){
        var f=st.backgroundColor;
        if(alfa(f)>=0.5){ bg=f; bloco=/^(block|flex|grid)$/.test(st.display); }
      }
      /* PRESERVA A QUEBRA DE LINHA: o Fato do FCA é "Pneus" + o desvio +
         as Contas, uma por linha (o fca-preenchimento grava \\n de propósito).
         Achatar tudo num parágrafo é o que fazia o slide dele ficar ilegível. */
      return { t:(c.innerText||'').replace(/[ \\t]+/g,' ').replace(/\\n{2,}/g,'\\n')
                 .split('\\n').map(function(x){return x.trim();}).filter(function(x,i,a){
                   return x||(i>0&&i<a.length-1); }).join('\\n').trim(),
               cor:st.color, bg:bg, bloco:bloco,
               neg:(parseInt(st.fontWeight,10)||400)>=700,
               dir:st.textAlign==='right'||c.classList.contains('num'),
               span:+(c.getAttribute('colspan')||1) };
    }
    var vis=function(n){ return cs(n).display!=='none'; };
    var cab=[].slice.call(t.querySelectorAll('thead tr')).filter(vis)
      .map(function(tr){ return [].slice.call(tr.children).filter(vis).map(cel); });
    var lin=[].slice.call(t.querySelectorAll('tbody tr')).filter(vis).map(function(tr){
      return { cels:[].slice.call(tr.children).filter(vis).map(cel),
               total:/total|ebitda|ref-row/i.test(tr.className) };
    }).filter(function(l){ return l.cels.length && l.cels.some(function(c){ return c.t; }); });
    if(!cab.length||!lin.length) return null;
    return { tipo:'tabela', cab:cab[cab.length-1].map(function(c){ return c.t; }),
             dir:cab[cab.length-1].map(function(c){ return c.dir; }),
             linhas:lin.map(function(l){
               return { total:l.total, cels:l.cels.map(function(c){
                 return { t:c.t, cor:c.cor, bg:c.bg, bloco:c.bloco,
                          neg:c.neg||l.total, dir:c.dir }; }) };
             }) };
  },
  /* ── O PÓDIO SAI DO PÓDIO, não do ranking ──
     Renan, 19/09/2026: "pódios sem os bonecos". Eu montava os três degraus
     das três primeiras LINHAS da tabela de ranking, que não tem avatar
     nenhum. O painel já desenha o pódio com o boneco de cada gestor; aqui leio
     aquele desenho — nome, unidade, pontos e a URL da imagem, absolutizada
     porque o slide é montado em /check-metas/ e o src é relativo ao painel.
     Devolve na ordem 1º, 2º, 3º; quem monta o slide é que sabe a ordem visual. */
  podio:function(){
    var slots=[].slice.call(document.querySelectorAll('.podio-slot'));
    if(!slots.length) return null;
    var ordem={primeiro:0,segundo:1,terceiro:2};
    var out=[];
    slots.forEach(function(s){
      var i=null;
      for(var k in ordem) if(s.classList.contains(k)) i=ordem[k];
      if(i==null) return;
      var im=s.querySelector('img.avatar-img');
      var tx=function(sel){ var e=s.querySelector(sel); return e?(e.textContent||'').trim():''; };
      /* NÃO exijo naturalWidth: a imagem pode ainda não estar decodificada no
         instante da leitura e o pódio sairia sem boneco por corrida. Quem
         espera a decodificação é o slImgsProntas, na hora da foto; o painel já
         apaga a <img> que não carregou (onerror → display:none). */
      out[i]={ nome:tx('.pedestal-name'), unidade:tx('.pedestal-unit'),
               pontos:tx('.pedestal-score'),
               avatar:(im && im.style.display!=='none')?im.src:'' };
    });
    out=out.filter(Boolean);
    if(!out.length) return null;
    /* O BRASÃO é a marca-d'água que o painel põe atrás do pódio
       (.podio-section::after). Sem ele o slide fica com o fundo escuro e nada
       mais — "poderia usar toda a temática" (Renan, 19/09/2026). */
    var bras='';
    for(var n=slots[0]; n && n!==document.body && !bras; n=n.parentElement){
      ['::after','::before',null].forEach(function(ps){
        if(bras) return;
        var b=window.getComputedStyle(n,ps).backgroundImage;
        var m=b&&b.match(/url\\(["']?([^"')]+)["']?\\)/);
        if(m) bras=m[1];
      });
    }
    return { tres:out, brasao:bras };
  },
  /* ── CARDS DE KPI, sem depender das classes de cada painel ──
     Cada painel nomeia o card de um jeito (.kpi, .kpi-card, .ch-min…), e
     casar por classe erraria no próximo. O que TODO card do padrão tem em
     comum é a hierarquia de tamanho: o VALOR é o maior texto, o rótulo é o
     que vem antes dele, o resto é meta. Leio isso do estilo computado. */
  kpis:function(raiz){
    var self=this, out=[];
    var cs=function(n){ return window.getComputedStyle(n); };
    var sel='.kpi,.kpi-card,.ch-min,.card-kpi,.mini-card';
    var cards=[].slice.call((raiz||document).querySelectorAll(sel))
      .filter(function(k){ return k.offsetHeight>28 && k.offsetWidth>60; });
    cards.forEach(function(k){
      var txt=[].slice.call(k.querySelectorAll('*')).filter(function(n){
        return n.children.length===0 && (n.textContent||'').trim() && cs(n).display!=='none';
      }).map(function(n){ var st=cs(n);
        return { t:(n.textContent||'').replace(/\\s+/g,' ').trim(),
                 fs:parseFloat(st.fontSize)||0, cor:st.color }; });
      if(!txt.length) return;
      var val=txt.slice().sort(function(a,b){ return b.fs-a.fs; })[0];
      var i=txt.indexOf(val);
      var rot=txt.slice(0,i).map(function(x){return x.t;}).join(' ');
      var meta=txt.slice(i+1).map(function(x){return x.t;}).join(' · ');
      if(!val.t) return;
      out.push({ rotulo:rot||'', valor:val.t, cor:val.cor, meta:meta||'' });
    });
    return out;
  },
  /* QUANTAS COLUNAS A GRADE DE KPI DO PAINEL TEM. O Scorecard mostra os 20
     indicadores em 10 colunas compactas; eu repartia por uma regra minha e
     saíam 7 por linha, gordos, comendo a altura do gráfico. Quem sabe a
     densidade certa é o painel. */
  kcols:function(raiz){
    /* MEDIR, não ler o CSS: o computed de grid-template-columns nem sempre vem
       resolvido em px (veio "1fr" e a conta deu UMA coluna), e aí a fileira de
       20 indicadores saía empilhada. Quantos cards dividem a PRIMEIRA linha é
       o número de colunas, e isso é medida, não interpretação. */
    var sel='.kpi,.kpi-card,.ch-min,.card-kpi,.mini-card';
    var ks=[].slice.call((raiz||document).querySelectorAll(sel))
      .filter(function(k){ return k.offsetHeight>10; });
    if(ks.length<2) return 0;
    var g=ks[0].parentNode, topo=ks[0].offsetTop, n=0;
    for(var i=0;i<ks.length;i++){
      if(ks[i].parentNode!==g || ks[i].offsetTop!==topo) break;
      n++;
    }
    return n;
  },
  /* ── HERO: o número principal, que no padrão fica FORA de card ──
     Renan, 19/09/2026: "faltou realizado". O hero é ".fin-hero > div" com
     .hlbl/.hval/.hdel (layout novo) ou ".hero" com .hero-label/.hero-value
     (layout antigo) — nenhum dos dois tem classe de card, então o leitor de
     KPI não os enxergava e o número que se lê primeiro ficava de fora.
     São VÁRIOS quando o painel tem: a Visão Financeira traz Receita Líquida
     e EBITDA lado a lado. */
  heros:function(raiz){
    var cs=function(n){ return window.getComputedStyle(n); };
    var r=raiz||document, out=[];
    var caixas=[].slice.call(r.querySelectorAll('.fin-hero > div'));
    if(!caixas.length) caixas=[].slice.call(r.querySelectorAll('.hero'));
    caixas.forEach(function(h){
      if(cs(h).display==='none') return;
      var lbl=h.querySelector('.hlbl,.hero-label');
      var val=h.querySelector('.hval,.hero-value');
      if(!val) return;
      var t=(val.innerText||'').replace(/\\s+/g,' ').trim();
      if(!t||t==='—') return;
      var del=[].slice.call(h.querySelectorAll('.hdel > div')).map(function(d){
        var b=d.querySelector('b'); if(!b) return null;
        var v=(b.innerText||'').trim();
        var rot=(d.innerText||'').replace(v,'').replace(/\\s+/g,' ').trim();
        if(!v||v==='—') return null;
        return {rotulo:rot, valor:v, cor:cs(b).color};
      }).filter(Boolean);
      var sub=h.querySelector('.hero-sub');
      out.push({ rotulo:lbl?(lbl.innerText||'').trim():'', valor:t, cor:cs(val).color,
                 sub:sub?(sub.innerText||'').replace(/\\s+/g,' ').trim():'', deltas:del });
    });
    return out;
  },
  /* ── GRÁFICOS: os DADOS do Chart.js, não o pixel ──
     Renan, 19/09: "Dispersão de km seara não saiu" — o canvas saía em branco
     porque a foto acontecia no meio da animação. Levando os dados, o gráfico
     é redesenhado no slide com animation:false e não existe corrida.
     São TODOS (era só o primeiro): a Dispersão tem Dispersão de KM % e
     Impacto financeiro, o Scorecard Financeiro tem Custo Nominal e AV Custo —
     e o segundo sumia do deck sem aviso. */
  grafs:function(raiz){
    var C=window.Chart; if(!C||!C.getChart) return [];
    var cs=function(n){ return window.getComputedStyle(n); };
    var out=[];
    [].slice.call((raiz||document).querySelectorAll('canvas')).forEach(function(cv){
      if(cv.offsetHeight<40) return;
      var ch=null; try{ ch=C.getChart(cv); }catch(e){}
      if(!ch||!ch.data||!ch.data.datasets) return;
      var ds=ch.data.datasets.filter(function(d){ return (d.data||[]).length; });
      if(!ds.length) return;
      var card=cv.closest('.gcard,.chart-card,.card,.ch-card')||cv.parentNode;
      var tt=card?card.querySelector('.gt,.ct,.chart-title,.card-title,.tbl-title,b'):null;
      var ss=card?card.querySelector('.gs,.cs,.chart-sub,.tbl-sub'):null;
      /* A LEGENDA É A DO PAINEL (.gleg), não a do Chart.js: o padrão desenha
         quadradinho para barra e tracinho tracejado para linha, em HTML, com
         "legend:{display:false}" no gráfico. As bolinhas no canto eram a
         legenda nativa, que o portal não usa em lugar nenhum. */
      var gl=card?card.querySelector('.gleg'):null;
      var leg=gl?[].slice.call(gl.querySelectorAll('span')).map(function(s){
        var i=s.querySelector('i');
        return { t:(s.innerText||'').replace(/\\s+/g,' ').trim(),
                 cor:i?cs(i).color:cs(s).color, sq:!!(i&&i.classList.contains('sq')) };
      }).filter(function(x){ return x.t; }):null;
      /* A JANELA DO EIXO É A DO PAINEL. Eu forçava beginAtZero e a Evolução,
         que vai de 70% a 110%, virava 0 a 100 — as barras viraram torres e a
         diferença entre 84,6 e 91,3 sumiu. Os rótulos do eixo vêm prontos,
         então o "%" e o "mi" vêm junto sem eu adivinhar a unidade. */
      var eixo=function(k){
        var s=ch.scales&&ch.scales[k]; if(!s) return null;
        return { min:s.min, max:s.max,
                 oculto:!!(s.options&&s.options.display===false),
                 grade:!!(s.options&&s.options.grid&&s.options.grid.display!==false),
                 ticks:(s.ticks||[]).map(function(t){ return {v:t.value,l:String(t.label==null?'':t.label)}; }) };
      };
      /* O RÓTULO DE DADOS VEM DO FORMATTER DO PAINEL — ele é que sabe se é
         "+17.7%", "334.55k" ou "5.00 mi", e se aparece em toda barra ou só no
         mês corrente. Reformatar aqui foi o que tirou o sinal e o sufixo.
         undefined = o painel não diz; null = o painel esconde. */
      var dl=(ch.options&&ch.options.plugins&&ch.options.plugins.datalabels)||null;
      /* O AJUSTE DE CADA DATASET SOBREPÕE O DO GRÁFICO — é assim que o plugin
         funciona, e é onde o Frota de Elite põe o formatter: o gráfico tem
         "datalabels:{}" VAZIO e a BARRA carrega
         "datalabels:{formatter: v => v.toFixed(1)}". Lendo só o do gráfico eu
         nunca achava o texto, e a Evolução saía sem rótulo nenhum. */
      var dlDe=function(d){
        var o={}, k;
        for(k in (dl||{})) o[k]=dl[k];
        for(k in (d.datalabels||{})) o[k]=d.datalabels[k];
        return o;
      };
      var mostra=function(d,i,v){
        var e=dlDe(d);
        if(e.display===false) return false;
        if(typeof e.display==='function'){
          try{ return !!e.display({chart:ch,dataset:d,dataIndex:i,
                 datasetIndex:ch.data.datasets.indexOf(d),active:false}); }catch(err){ return true; }
        }
        return true;
      };
      /* TRÊS RESPOSTAS, não duas: a string que o painel escreveu, vazio quando
         ele escreveu vazio de propósito, e FALSE quando não deu para saber
         (sem formatter, ou ele lançou). Tratar "não deu para saber" como vazio
         imprimia nada em vez de deixar o portal formatar. */
      var texto=function(d,i,v){
        var e=dlDe(d);
        if(typeof e.formatter!=='function') return false;
        try{ var t=e.formatter(v,{chart:ch,dataset:d,dataIndex:i,
               datasetIndex:ch.data.datasets.indexOf(d),active:false});
             return t==null?'':String(t); }catch(err){ return false; }
      };
      out.push({
        titulo:tt?(tt.innerText||'').trim():'',
        sub:ss?(ss.innerText||'').replace(/\\s+/g,' ').trim():'',
        tipo:ch.config.type||'bar',
        labels:(ch.data.labels||[]).map(function(l){ return String(l); }),
        legenda:leg, eixoY:eixo('y'), eixoX:eixo('x'),
        rotDef:ds.some(function(d){ return typeof dlDe(d).formatter==='function'; }),
        /* legenda NATIVA ligada e sem .gleg: o painel mostra legenda, e o slide
           precisa mostrar também — o Frota de Elite é assim e o slide saiu sem
           nenhuma. O desenho continua o do portal (quadradinho/tracinho). */
        legNativa:!!(ch.options&&ch.options.plugins&&ch.options.plugins.legend
                     &&ch.options.plugins.legend.display!==false),
        datasets:ds.map(function(d){
          var cor=function(v){ return (typeof v==='string')?v:(Array.isArray(v)?v.map(function(x){return typeof x==='string'?x:null;}):null); };
          var vals=(d.data||[]).map(function(v){ return (v&&typeof v==='object')?(v.y!=null?v.y:v.v):v; });
          return { label:d.label||'', data:vals,
                   mostra:vals.map(function(v,i){ return mostra(d,i,v); }),
                   rotulos:vals.map(function(v,i){ return texto(d,i,v); }),
                   backgroundColor:cor(d.backgroundColor), borderColor:cor(d.borderColor),
                   borderDash:d.borderDash||undefined, tipo:d.type||null };
        })
      });
    });
    return out;
  },

  /* topo cortado = contêiner rolado. Zera tudo antes da foto. */
  topo:function(el){
    for(var n=el; n && n!==document.documentElement; n=n.parentElement){ n.scrollTop=0; n.scrollLeft=0; }
    [].slice.call(el.querySelectorAll('*')).forEach(function(n){ n.scrollTop=0; n.scrollLeft=0; });
    try{ window.scrollTo(0,0); }catch(e){}
  },
  /* A TABELA ROLA DENTRO DO CARD: o painel tem altura de tela e o miolo
     rola. O html2canvas fotografa só o que está visível, então o slide
     saía com meia tabela e sem aviso nenhum. Aqui o que corta é solto
     (ancestrais e descendentes), e depois devolvido ao que era. */
  abre:function(el){
    var mud=[], w=window;
    function guarda(n,p){ mud.push({n:n,st:n.getAttribute('style')}); for(var k in p) n.style[k]=p[k]; }
    for(var n=el; n && n!==document.documentElement; n=n.parentElement){
      var cs=w.getComputedStyle(n);
      if(cs.overflow!=='visible'||cs.overflowY!=='visible'||cs.maxHeight!=='none'||cs.position==='fixed'){
        guarda(n,{overflow:'visible',overflowY:'visible',overflowX:'visible',
                  maxHeight:'none',height:'auto',minHeight:'0'});
        if(cs.position==='fixed'){ n.style.position='static'; n.style.inset='auto'; }
      }
    }
    [].slice.call(el.querySelectorAll('*')).forEach(function(n){
      if(n.scrollHeight>n.clientHeight+2||n.scrollWidth>n.clientWidth+2){
        var c=w.getComputedStyle(n);
        if(c.overflow!=='visible'||c.overflowY!=='visible'||c.overflowX!=='visible')
          guarda(n,{overflow:'visible',maxHeight:'none',height:'auto'});
      }
    });
    window.__cmMud=mud;
    return el.scrollHeight;
  },
  fecha:function(){
    (window.__cmMud||[]).forEach(function(m){
      if(m.st===null) m.n.removeAttribute('style'); else m.n.setAttribute('style',m.st);
    });
    window.__cmMud=null;
  }
};`;

function garanteH2C(win){
  if(win.html2canvas) return Promise.resolve();
  return new Promise((res,rej)=>{
    const s=win.document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
    s.onload=()=>res(); s.onerror=()=>rej(new Error('html2canvas não carregou no painel'));
    win.document.head.appendChild(s);
  });
}

/* O painel está pronto quando o DOM PARA DE MUDAR.
   Não dá para procurar um sinal único: são 11 painéis, cada um com o seu
   jeito de dizer "carreguei". Medir a estabilidade serve para todos. */
async function esperaPronto(win,doc,teto){
  /* ESPERAR O CONTEÚDO EXISTIR, NÃO O DOM SOSSEGAR (Renan, 19/09/2026).
     A régua antiga media "o texto e o nº de elementos pararam de mudar" e
     dava dois falsos prontos, que ele viu nos dois slides:
       · Painel de Metas → saiu SÓ a faixa do cabeçalho, sem uma linha;
       · Dispersão de Km → os gráficos saíram em BRANCO.
     Os dois são o mesmo engano: o esqueleto da tabela já tem texto, e
     pintar o canvas do Chart.js não muda o DOM — então o medidor via
     calmaria e mandava fotografar o vazio.
     Agora o painel só é dado por pronto quando TEM linha de tabela ou um
     gráfico COM DADOS; sem nenhum dos dois até o teto, devolve 'vazio' e
     o slide vira aviso no Roteiro, em vez de página em branco. */
  teto=teto||T.teto;
  const t0=Date.now(); let ant=-1, quieto=0;
  const temConteudo=()=>{
    if(doc.querySelectorAll('tbody tr').length>0) return true;
    const C=win.Chart;
    if(C&&C.getChart){
      const cvs=[...doc.querySelectorAll('canvas')];
      for(const cv of cvs){
        let ch=null; try{ ch=C.getChart(cv); }catch(e){}
        if(ch&&ch.data&&(ch.data.datasets||[]).some(d=>(d.data||[]).length)) return true;
      }
    }
    /* painel sem tabela e sem gráfico (cartões, árvore): vale o texto */
    if(!doc.querySelector('table,canvas')) return (doc.body?doc.body.innerText.length:0)>400;
    return false;
  };
  while(Date.now()-t0<teto){
    await espera(T.passo);
    if(doc.querySelector('.gate')) return 'gate';
    const txt=doc.body?doc.body.innerText:'';
    if(/carregando/i.test(txt)){ quieto=0; continue; }
    if(!temConteudo()){ quieto=0; continue; }
    const n=txt.length+doc.querySelectorAll('tbody tr').length*7;
    if(n===ant) quieto++; else { quieto=0; ant=n; }
    if(quieto>=T.quieto && Date.now()-t0>T.min) return 'ok';
  }
  return (doc.querySelectorAll('tbody tr').length||doc.querySelector('canvas'))?'demorou':'vazio';
}


const escuro=c=>{ const m=String(c||'').match(/(\d+)[,\s]+(\d+)[,\s]+(\d+)/);
  return m ? (+m[1]+ +m[2]+ +m[3])/3 < 110 : false; };
async function tiraFoto(win,el){
  const prep=win.H2CPrep||null;
  const h2c=win.html2canvas;
  /* o fundo vem do ALVO, não do body: no layout ANTIGO o tema claro pinta
     o `.main`, e o body FICA ESCURO — pegando o do body, a borda da foto
     saía preta em volta de um card branco. */
  /* o fundo vem do ALVO, não do body: no layout ANTIGO o tema claro pinta
     o `.main` e o body FICA ESCURO — pegando o do body, a foto saía com
     borda preta em volta de um card branco. E, no claro, fundo escuro é
     sinal de que a herança se perdeu: vale o branco. */
  const claro=win.document.body.classList.contains('claro')||win.document.body.classList.contains('light-mode');
  /* O FUNDO DA FOTO É O DO SLIDE (Renan, 20/09/2026: "sem fundo branco" ·
     "sem esses fundos brancos porra"). Pegando o do painel, a árvore vinha
     sobre um branco que virava uma placa dentro do slide cinza. */
  const doSlide=(window.SlidePadrao&&window.SlidePadrao.TK.fundo)||'#E1E2E5';
  const bg=doSlide;
  const nodes=prep?prep.preparar(el,true):null;
  const o={scale:2,backgroundColor:bg,useCORS:true,logging:false};
  if(prep) o.onclone=prep.onclone;
  try{
    const c=await h2c(el,o);
    return {png:c.toDataURL('image/jpeg',0.95),w:c.width,h:c.height};
  } finally { if(prep&&prep.limpar) prep.limpar(nodes); }
}

async function capturaSlide(s){
  const msgs=[], fotos=[]; let podioDados=null;
  /* UM IFRAME POR URL: a Árvore e o FCA do mesmo recorte são DOIS painéis
     e vão no MESMO slide (Renan, 18/09/2026: "Árvore e FCA juntos... devem
     ser juntos"), que é como o PPT dele já faz — duas imagens empilhadas. */
  const tam=tamIframe(s.caps.length, s.caps.some(c=>c.rot));
  let ifr=null, win=null, doc=null, urlAtual=null;
  const fecha=()=>{ if(ifr){ ifr.remove(); ifr=null; win=null; doc=null; } };
  const abre=async url=>{
    fecha();
    ifr=document.createElement('iframe');
    ifr.style.width=tam.w+'px'; ifr.style.height=tam.h+'px';
    $('palco').style.width=Math.max(1600,tam.w)+'px';
    $('palco').appendChild(ifr);
    await new Promise((res,rej)=>{
      const to=setTimeout(()=>rej(new Error('o painel não abriu em 60s')),60000);
      ifr.onload=()=>{clearTimeout(to);res();};
      ifr.onerror=()=>{clearTimeout(to);rej(new Error('o painel não abriu'));};
      ifr.src=url;
    });
    win=ifr.contentWindow; doc=ifr.contentDocument;
    if(!doc) throw new Error('iframe sem documento (origem diferente?)');
    const estado=await esperaPronto(win,doc);
    if(estado==='gate') throw new Error('o painel recusou: '+((doc.querySelector('.gate h2')||{}).textContent||'sem acesso'));
    if(estado==='demorou') msgs.push('o painel ainda estava carregando quando li os dados');
    if(estado==='vazio')   msgs.push('o painel não trouxe dado nenhum no tempo limite — slide vazio evitado');
    await garanteH2C(win);
    win.eval(CM_HELPER);
    claro(win,doc);
    await espera(T.tema);
  };
  try{
    for(const c of s.caps){
      const url=c.url||s.url;
      if(url!==urlAtual){ await abre(url); urlAtual=url; }
      if(c.prep){
        const f=win.eval('(function(){__cm.faltou=[];try{'+c.prep+'}catch(e){__cm.faltou.push("erro: "+e.message);}return __cm.faltou;})()');
        (f||[]).forEach(m=>msgs.push(m));
      }
      await espera(c.esp||T.pos);
      claro(win,doc);                     /* o painel reaplica o tema dele ao terminar de carregar */
      /* o pódio é lido do PÓDIO do painel (com o boneco), não das três
         primeiras linhas do ranking — que não têm avatar nenhum */
      if(s.podio && !podioDados){
        try{ podioDados=win.eval('(function(){try{return __cm.podio();}catch(e){return null;}})()'); }catch(e){}
        if(!podioDados) msgs.push('não achei o pódio do painel — montei do ranking, sem os bonecos');
      }
      if(s.podio && podioDados && !podioDados.brasao) msgs.push('o pódio saiu sem o brasão do Frota de Elite');
      const el=win.eval('(function(){try{return '+(c.alvo||ALVO_PADRAO)+';}catch(e){return null;}})()')||doc.body;
      if(!el||!el.offsetHeight) msgs.push('alvo vazio — usei a página inteira');
      let alvo=(el&&el.offsetHeight)?el:doc.body;
      let alvoCheio=alvo, abriu=false;
      try{
        win.__cm.topo(alvo);
        /* o tabela() REDUZ o alvo ao <table> (é o que tira a moldura do card
           do slide). Guardo o alvo inteiro antes: KPI e gráfico moram FORA da
           tabela, e procurá-los no alvo reduzido nunca acha nada — foi o que
           deixou o gráfico de fora do slide. */
        alvoCheio=alvo;
        /* `semTab` é o slide que quer o HERO e os GRÁFICOS, não a tabela: sem
           isto o tabela() reduziria o alvo ao <table> e o slide viria com a
           tabela que já vai no slide seguinte, sem o hero. */
        /* FOTO NÃO PASSA PELO tabela() (bug real, 20/09/2026 — a Árvore saiu
           como UMA caixa gigante). O tabela() reduz o alvo ao primeiro <table>
           quando o card e bem maior que ele; na Árvore o primeiro <table> é a
           caixa do Custo Combustível, então eu fotografava aquela caixinha e a
           esticava para a página inteira. Slide de foto quer o desenho
           INTEIRO. */
        if(!c.semTab && c.foto!==true) alvo=win.__cm.tabela(alvo);
        const h=win.__cm.abre(alvo);
        const hh=Math.max(tam.h,Math.ceil(h)+40);
        if(hh>tam.h){
          /* cresce nos DOIS eixos: só na altura, a foto vira um retrato e
             as faixas brancas nas laterais voltam */
          const ww=Math.min(IFR_MAX,Math.round(hh*tam.r));
          ifr.style.height=hh+'px'; ifr.style.width=ww+'px';
          $('palco').style.width=Math.max(1600,ww)+'px';
        }
        abriu=true;
        await espera(T.abre||420);
      }catch(e){ msgs.push('não consegui abrir o conteúdo: '+(e&&e.message||e)); }
      try{
        /* O PAINEL ENTREGA DADOS, NÃO PIXEL (Renan, 19/09/2026: "criar mesmo
           algo novo, seguindo 100% nosso padrão visual"). Tudo que dá para
           ler como dado é redesenhado no slide com os tokens do portal; a
           foto é o último recurso, para visão que ainda não sei extrair. */
        let c1=null;
        if(c.foto!==true){
          try{
            /* CLONE PARA ESTE REALM: o iframe é destruído antes de o slide ser
               montado, e objeto vindo de um frame desligado é armadilha. Tudo
               que sai do extrai/kpis/grafs/heros é texto, número, null ou
               booleano, então o JSON basta. */
            const puro = x => { try{ return JSON.parse(JSON.stringify(x)); }catch(e){ return x; } };
            const tab=c.semTab?null:puro(win.__cm.extrai(alvo));
            const kp =puro(win.__cm.kpis(alvoCheio));
            const kc =win.__cm.kcols(alvoCheio);
            let gs =puro(win.__cm.grafs(alvoCheio));
            const hs =puro(win.__cm.heros(alvoCheio));
            /* "deixe só esses dois" (Renan, 19/09/2026, no Painel de Metas):
               o roteiro pode pedir só os N primeiros gráficos da visão. */
            if(c.nGraf && gs) gs=gs.slice(0,c.nGraf);
            if(tab||(gs&&gs.length)||(kp&&kp.length)||(hs&&hs.length))
              c1={tipo:'dados',tabela:tab,kpis:kp,kcols:kc,grafs:gs,heros:hs};
          }catch(e){ msgs.push('não consegui ler os dados: '+(e&&e.message||e)); }
        }
        if(c1) fotos.push({rot:c.rot,semCols:c.semCols,agrupa:c.agrupa,juntar:c.juntar,...c1});
        else { const foto=await tiraFoto(win,alvo); fotos.push({rot:c.rot,foto:true,...foto}); }
      } finally {
        if(abriu){ try{ win.__cm.fecha(); }catch(e){}
          ifr.style.height=tam.h+'px'; ifr.style.width=tam.w+'px'; await espera(120); }
      }
    }
  } finally { fecha(); }
  return {fotos,msgs,podioDados};
}

/* O TEMA CLARO TEM DE ESTAR NO localStorage ANTES DO PAINEL ABRIR.
   Chamar a função do painel não basta: o Frota de Elite (e outros)
   reaplica `bi_theme` quando termina de carregar os dados, e o slide
   voltava escuro. Como a origem é a mesma, o localStorage é o do portal
   — por isso `gerar()` guarda o valor do Renan e devolve no fim. */
function claro(win,doc){
  ['aplicaTema','applyTheme','setTema'].forEach(f=>{
    try{ if(typeof win[f]==='function') win[f]('light'); }catch(e){}
  });
  try{ doc.body.classList.add('claro','light-mode'); }catch(e){}
}

/* ══════════════════════════════════════════════════════════════
   4 · MONTAGEM — PDF (jsPDF) e PPT (PptxGenJS), no MESMO desenho
   16:9 de 13,333 × 7,5 pol, a mesma medida do PPT que ele monta.
   ══════════════════════════════════════════════════════════════ */
/* A FOTO TEM DE NASCER NA PROPORÇÃO DA CAIXA DO SLIDE.
   Eu fotografava a 1600×900 (16:9 = 1,78) e encaixava numa caixa de
   12,77 × 6,36 pol (2,01) — o lado curto mandava, e o slide saía com o
   painel espremido no meio e duas faixas brancas enormes nas laterais,
   com o título desalinhado da imagem. Medindo a caixa ANTES e dando ao
   iframe essa mesma proporção, a imagem preenche a página inteira e
   começa exatamente onde o título começa. */
const IFR_W=1760, IFR_MAX=3000;
/* O IFRAME AGORA SÓ PRECISA RENDERIZAR O PAINEL, não posar para a foto.
   Antes a proporção dele tinha de casar com a caixa do slide, porque a
   imagem era encaixada; hoje o slide é desenhado e o painel é só a fonte
   dos dados, então vale uma janela larga e estável. */
function tamIframe(){ return {w:IFR_W,h:Math.round(IFR_W*9/16),r:16/9}; }

/* ══════════════════════════════════════════════════════════════
   4 · MONTAGEM — o slide é DESENHADO no padrão (check-metas/slides.js)
   e vira uma página inteira, igual no PDF e no PPT. Não há mais tabela
   redesenhada no jsPDF: era dela que vinham o Δ virando aspas, o acento
   comido, a coluna truncada e a fonte errada.
   ══════════════════════════════════════════════════════════════ */
const LAY_W=13.3333, LAY_H=7.5;

async function paginasDo(s){
  const SP=window.SlidePadrao;
  if(s.cheia) return [s.cheia];                       /* capa / divisória */
  const blocos=(s.fotos||[]).map(f=>({rot:f.rot,tabela:f.tabela,kpis:f.kpis,kcols:f.kcols,
    grafs:f.grafs,heros:f.heros,semCols:f.semCols,agrupa:f.agrupa,juntar:f.juntar,
    png:f.foto?f.png:null}));
  /* pódio: o do PAINEL (com boneco); sem ele, os três primeiros do ranking */
  let els;
  const pd=s.podioDados;
  if(s.podio && pd && (pd.tres||[]).length){
    els=SP.slPodio(s.tit,s.sub,pd.tres.slice(0,3),pd.brasao);
  } else if(s.podio && blocos[0] && blocos[0].tabela){
    const L=blocos[0].tabela.linhas.filter(l=>!l.total).slice(0,3).map(l=>{
      const c=l.cels||[];
      return { nome:(c[0]&&c[0].t)||'', unidade:(c[1]&&c[1].t&&isNaN(parseFloat(c[1].t)))?c[1].t:'',
               pontos:(c[c.length-1]&&c[c.length-1].t)||'' };
    });
    els=L.length?SP.slPodio(s.tit,s.sub,L):SP.slMonta(s.tit,s.sub,blocos);
  } else els=SP.slMonta(s.tit,s.sub,blocos);
  /* SLIDE QUE NÃO SAI TEM DE APARECER COMO NÃO SAINDO. Sem isto o slMonta
     devolvia lista vazia e a página simplesmente não existia no arquivo — foi
     assim que o Painel de Metas "não apareceu", sem uma linha no log. */
  if(!els.length){
    const {el,mio}=SP.slNovo(s.tit,s.sub);
    const v=document.createElement('div'); v.className='sl-vazio';
    v.textContent='o painel não entregou dado para este recorte';
    mio.appendChild(v); els=[el];
    ovLog('⚠ '+s.tit+(s.sub?' ('+s.sub+')':'')+': saiu sem conteúdo');
  }
  const out=[];
  for(const el of els){ out.push(await SP.slFoto(el)); }
  SP.slLimpa();
  return out;
}

async function montaPDF(slides){
  const {jsPDF}=window.jspdf;
  const pdf=new jsPDF({orientation:'landscape',unit:'in',format:[LAY_W,LAY_H]});
  let primeira=true;
  for(const s of slides){
    const pgs=await paginasDo(s);
    for(const png of pgs){
      if(!primeira) pdf.addPage([LAY_W,LAY_H],'landscape');
      primeira=false;
      pdf.addImage(png,'JPEG',0,0,LAY_W,LAY_H);
    }
  }
  pdf.save(nomeArq('pdf'));
}

async function montaPPT(slides){
  const pptx=new PptxGenJS();
  pptx.defineLayout({name:'GEM169',width:LAY_W,height:LAY_H});
  pptx.layout='GEM169';
  pptx.author='Gestão em Movimento'; pptx.title='Check de Metas '+vigExt(VIG);
  for(const s of slides){
    const pgs=await paginasDo(s);
    for(const png of pgs){
      const sl=pptx.addSlide();
      sl.addImage({data:png,x:0,y:0,w:LAY_W,h:LAY_H});
    }
  }
  await pptx.writeFile({fileName:nomeArq('pptx')});
}
const nomeArq=ext=>'Check_de_Metas_'+VIG.replace('-','_')+'.'+ext;

let GERANDO=false;
function ovLog(msg,ruim){ const l=$('ov-log'); if(l) l.innerHTML+=(ruim?'<b>':'')+esc(msg)+(ruim?'</b>':'')+'<br>'; if(l) l.scrollTop=l.scrollHeight; }

async function gerar(fmt){
  if(GERANDO) return;
  if(!ROTEIRO.length){ alert('Escolha o fechamento no filtro do topo.'); return; }
  GERANDO=true;
  const ov=$('ger-ov'); ov.classList.add('on'); $('ov-fim').style.display='none'; $('ov-log').innerHTML='';
  set('ov-tit',fmt==='pdf'?'Gerando o PDF…':'Gerando o PPT…');
  const t0=Date.now(); const saida=[]; let falhas=0, atencao=0;
  const temaDoRenan=localStorage.getItem('bi_theme');
  try{ localStorage.setItem('bi_theme','light'); }catch(e){}
  try{
    await carregaFoto();
    try{ await document.fonts.load('800 104px Montserrat'); }catch(e){}
    for(let i=0;i<ROTEIRO.length;i++){
      const s=ROTEIRO[i];
      const pct=Math.round(i/ROTEIRO.length*100);
      $('ov-barra').style.width=pct+'%';
      set('ov-n',(i+1)+' / '+ROTEIRO.length);
      set('ov-t',Math.round((Date.now()-t0)/1000)+'s');
      set('ov-qual',s.t==='sec'?('Divisória · '+s.txt):(s.tit+(s.sub?' · '+s.sub:'')));
      if(s.t==='capa'){ saida.push({cheia:desenhaCapa(s,2400,1350)}); ESTADO[i]={ok:1,msgs:[]}; pintaRoteiro(); continue; }
      if(s.t==='sec'){ saida.push({cheia:desenhaSecao(s,2400,1350)}); ESTADO[i]={ok:1,msgs:[]}; pintaRoteiro(); continue; }
      try{
        const r=await capturaSlide(s);
        saida.push({tit:s.tit,sub:s.sub,podio:s.podio,podioDados:r.podioDados,fotos:r.fotos});
        ESTADO[i]={ok:1,msgs:r.msgs};
        if(r.msgs.length){ atencao++; ovLog('⚠ '+s.tit+(s.sub?' ('+s.sub+')':'')+': '+r.msgs.join(' · ')); }
      }catch(e){
        falhas++; ESTADO[i]={err:1,msgs:[String(e&&e.message||e)]};
        ovLog('✗ '+s.tit+': '+(e&&e.message||e),true);
      }
      pintaRoteiro();
    }
    $('ov-barra').style.width='100%';
    set('ov-qual','Montando o arquivo…');
    const comFoto=saida.filter(s=>s.cheia||(s.fotos&&s.fotos.length)
      ||(s.podioDados&&(s.podioDados.tres||[]).length));
    if(!comFoto.length) throw new Error('nenhum slide saiu — nada a salvar');
    if(fmt==='pdf') await montaPDF(comFoto); else await montaPPT(comFoto);
    set('ov-tit','Pronto');
    set('ov-qual',comFoto.length+' slides · '+falhas+' falha(s) · '+atencao+' com atenção');
    ovLog('Arquivo salvo: '+nomeArq(fmt==='pdf'?'pdf':'pptx'));
  }catch(e){
    set('ov-tit','Não deu');
    ovLog(String(e&&e.message||e),true);
  }finally{
    try{ if(temaDoRenan==null) localStorage.removeItem('bi_theme');
         else localStorage.setItem('bi_theme',temaDoRenan); }catch(e){}
    GERANDO=false; $('ov-fim').style.display='flex';
    set('ov-t',Math.round((Date.now()-t0)/1000)+'s');
    pintaRoteiro();
  }
}

async function carregaFcas(){

    .select('vigencia,unidade,projeto,fato,fato_desvio,causa,acao,responsavel,prazo')
    .eq('origem','Custos').limit(6000);

  FCAS=data||[];

  FCAS.forEach(f=>{ const k=vigKeyDe(f.vigencia); if(k) ks.add(k); });
